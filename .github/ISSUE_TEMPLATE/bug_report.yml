name: Bug report
description: Report a reproducible scanner or documentation problem using synthetic or redacted evidence only.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, private keys, auth-file contents, personal paths, or real host forensic data. Use synthetic samples and redact reports before attaching excerpts. Report security vulnerabilities through the private Security Advisory link instead.
  - type: input
    id: version
    attributes:
      label: Scanner version
      description: The version shown near the top of the TXT or JSON report.
      placeholder: 0.1.20
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Scan mode
      options:
        - Recommended project scan
        - Selected checks
        - Deep traversal
        - Major PC locations
        - User profile or endpoint telemetry
        - Comprehensive bounded scan
        - Documentation or packaging only
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Explain the expected and actual behavior without host-identifying data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal synthetic file names and contents. Do not include downloaded malware or usable credentials.
      render: text
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation details
      description: Include the selected checks, exit code, and scanComplete value. Redact all paths and report evidence.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I confirmed that this issue contains no secret values, auth-file contents, personal paths, or real host forensic data.
          required: true
