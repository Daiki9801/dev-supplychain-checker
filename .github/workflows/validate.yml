          if ($LASTEXITCODE -notin @(0, 1, 2)) { throw 'v0.1.18 precision scan failed.' }
          $precision = Get-Content -LiteralPath $precisionJson -Raw | ConvertFrom-Json
          if (@($precision.findings | Where-Object { $_.path -like '*v018-precision\package.json' -and $_.category -eq 'NODE_RUNTIME_VULNERABILITY_VERSION' }).Count -ne 1) {
            throw 'A project-owned Volta Node pin was not inspected.'
          }
          if (@($precision.findings | Where-Object { $_.path -like '*node_modules\typescript\package.json' -and $_.category -like 'NODE_RUNTIME_VULNERABILITY*' }).Count -ne 0) {
