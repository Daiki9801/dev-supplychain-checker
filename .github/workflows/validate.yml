          $verboseText = Join-Path $reportRoot 'verbose.txt'
          $verboseJson = Join-Path $reportRoot 'verbose.json'
          $verboseOutput = @(& powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\Scan-DevSupplyChain.ps1 -Path .\tests\samples\clean-js -Checks Recommended `
            -TextOut $verboseText -JsonOut $verboseJson -VerboseProgress -NoColor 2>&1)
          if (@($verboseOutput | Where-Object { [string]$_ -match 'progress:.*current=' }).Count -lt 1) {
            throw 'Verbose progress did not retain detailed current-path diagnostics.'
          }
          exit 0

      - name: Check v0.1.20-v0.1.21 triage, Node summaries, and coverage summaries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path '.\reports' -Force | Out-Null

          function Invoke-V020Scan {
            param([string]$Name, [string]$Target, [string[]]$Checks, [string[]]$ExtraArgs = @())
            $json = ".\reports\v020-$Name.json"
            $text = ".\reports\v020-$Name.txt"
            $arguments = @(
              '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
              '-File', '.\Scan-DevSupplyChain.ps1',
              '-Path', $Target,
              '-Checks', ($Checks -join ','),
              '-TextOut', $text,
              '-JsonOut', $json,
              '-Quiet', '-NoColor'
            ) + $ExtraArgs
            & powershell.exe @arguments
            if ($LASTEXITCODE -notin @(0, 1, 2)) { throw ("v0.1.20 scan failed: {0}" -f $Name) }
            return (Get-Content -LiteralPath $json -Raw | ConvertFrom-Json)
          }

          $triage = Invoke-V020Scan -Name 'triage-precision' -Target '.\tests\samples\triage-precision' -Checks @('Recommended')
          if (@($triage.findings | Where-Object { $_.path -like '*Keyv-ChainDrop-NonDestructive-Check-v0.0.0.bat' -and $_.category -eq 'PACKAGE_CODE_SECRET_EXFIL_PATTERN' -and $_.severity -eq 'DANGER' }).Count -ne 1) {
            throw 'A spoofed legacy checker name bypassed active secret-exfiltration detection.'
          }
          if (@($triage.findings | Where-Object { $_.category -eq 'GITHUB_ACTIONS_MANUAL_TRIGGER' -and $_.path -match 'manual-only' -and $_.severity -eq 'CAUTION' }).Count -ne 1) {
            throw 'Manual-only workflow severity regression.'
          }
          if (@($triage.findings | Where-Object { $_.category -eq 'GITHUB_ACTIONS_MANUAL_TRIGGER' -and $_.path -match 'manual-elevated' -and $_.severity -eq 'WARN' }).Count -ne 1) {
            throw 'Elevated manual workflow severity regression.'
          }
          if (@($triage.findings | Where-Object { $_.category -eq 'AI_REFERENCE_TEXT_EXECUTABLE_SAMPLE_RISK_AGGREGATED' -and $_.severity -eq 'CAUTION' }).Count -ne 1) {
            throw 'Reference-text executable example severity regression.'
          }
          if (@($triage.findings | Where-Object { $_.category -eq 'AI_TOOLING_UNPINNED_NPX' -and $_.severity -eq 'CAUTION' }).Count -ne 1) {
            throw 'Passive AI tooling npx severity regression.'
          }
          if (@($triage.findings | Where-Object { $_.category -eq 'AI_TOOLING_EXTERNAL_EXECUTION_CAPABILITY' -and $_.severity -eq 'CAUTION' -and $_.riskType -eq 'capability' }).Count -ne 1) {
            throw 'Passive AI tooling fetch-execute capability regression.'
          }
          if (@($triage.findings | Where-Object { $_.category -eq 'MCP_UNPINNED_NPX' -and $_.severity -eq 'WARN' }).Count -ne 1) {
            throw 'Active MCP unpinned npx severity regression.'
          }
          if (@($triage.findings | Where-Object { $_.category -eq 'MCP_AGENT_EXTERNAL_EXECUTION' -and $_.severity -eq 'DANGER' }).Count -ne 1) {
            throw 'Active MCP external execution DANGER regression.'
          }
          if (@($triage.findings | Where-Object { $_.path -match 'active-pinned' -and $_.category -match 'UNPINNED' }).Count -ne 0) {
            throw 'Pinned MCP package was reported as unpinned.'
          }
          if (@($triage.capabilitySummary | Where-Object { $_.provenance -eq 'plugin-cache' }).Count -lt 1) {
            throw 'AI tooling provenance summary regression.'
          }

          $ownWorkflow = Invoke-V020Scan -Name 'own-workflow' -Target '.\.github\workflows\validate.yml' -Checks @('CiCd')
          if (@($ownWorkflow.findings | Where-Object { $_.category -eq 'GITHUB_ACTIONS_MANUAL_TRIGGER' -and $_.severity -eq 'CAUTION' }).Count -ne 1) {
            throw 'Read-only manual validation workflow was not classified as CAUTION.'
          }

          $highNode = Invoke-V020Scan -Name 'node-high-priority' -Target '.\tests\samples\node-runtime-high-pin' -Checks @('NodeRuntime')
          if (@($highNode.priorityFindings | Where-Object { $_.riskType -eq 'vulnerability' -and $_.vulnerability.upstreamSeverity -eq 'HIGH' }).Count -ne 1) {
            throw 'Project-owned HIGH Node.js version finding was absent from priority findings.'
          }
          if ([int]$highNode.nodeRuntimeAssessment.installedBinaries.vulnerable -ne 0 -or [int]$highNode.nodeRuntimeAssessment.projectReferences.vulnerable -ne 1) {
            throw 'Project Node finding was not separated from installed Node results.'
          }

          $limited = Invoke-V020Scan -Name 'coverage-limit' -Target '.\tests\samples\triage-precision' -Checks @('Recommended') -ExtraArgs @('-MaxFiles', '2')
          if ([bool]$limited.scanComplete -or [int]$limited.coverage.summary.totalFailures -lt 1) {
            throw 'Incomplete scan coverage summary regression.'
          }
          if ([string]::IsNullOrWhiteSpace([string]$limited.coverage.summary.nextAction)) {
            throw 'Incomplete scan did not provide a next action.'
          }
          if ([string]::IsNullOrWhiteSpace([string]$limited.completionStatus) -or $limited.completionStatus -ne $limited.coverage.summary.completionStatus) {
            throw 'Completion status contract regression.'
          }
          if ((Get-Content -LiteralPath '.\reports\v020-coverage-limit.txt' -Raw) -notmatch 'CoverageFailures: Critical=\d+; NonCritical=\d+; Total=\d+') {
            throw 'TXT coverage failure summary regression.'
          }

          $partial = Invoke-V020Scan -Name 'coverage-partial' -Target '.\tests\samples\clean-js' -Checks @('ScannerSelf') -ExtraArgs @('-MaxFileSizeMB', '0')
          if ($partial.completionStatus -ne 'partial-non-critical' -or $partial.coverage.summary.completionLabel -ne 'PARTIAL (non-critical)') {
            throw 'Non-critical partial completion status regression.'
          }
          if (@($partial.findings | Where-Object { $_.category -eq 'SCAN_COMPLETED' }).Count -ne 0 -or @($partial.findings | Where-Object { $_.category -eq 'SCAN_NONCRITICAL_COVERAGE_PARTIAL' }).Count -ne 1) {
            throw 'Partial scan emitted an unqualified completed result.'
          }

          $cacheRoot = Join-Path (Resolve-Path '.\reports') 'v020-npm-cache-limit-input'
          $cacheIndex = Join-Path $cacheRoot '_cacache\index-v5\aa'
          New-Item -ItemType Directory -Path $cacheIndex -Force | Out-Null
          foreach ($index in 1..501) {
            [System.IO.File]::WriteAllText((Join-Path $cacheIndex ("entry-{0:D3}" -f $index)), '{"name":"synthetic-cache-entry"}', (New-Object System.Text.UTF8Encoding($false)))
          }
          $env:DEV_SUPPLYCHAIN_CHECKER_TEST_NPM_CACHE_ROOTS = $cacheRoot
          try {
            $cache = Invoke-V020Scan -Name 'npm-cache-limit' -Target '.\tests\samples\clean-js' -Checks @('NpmCache') -ExtraArgs @('-SyntheticValidation')
          }
          finally {
            Remove-Item Env:DEV_SUPPLYCHAIN_CHECKER_TEST_NPM_CACHE_ROOTS -ErrorAction SilentlyContinue
          }
          if ([int]$cache.scanStats.npmCacheMetadataLimitReached -ne 1 -or $cache.coverage.summary.npmCacheCoverageStatus -ne 'bounded-metadata-limit-reached') {
            throw 'Bounded npm cache coverage status regression.'
          }
          if (-not [bool]$cache.mode.syntheticValidation) { throw 'Synthetic npm cache validation mode was not recorded.' }

          $outsideSyntheticRoot = Join-Path $env:RUNNER_TEMP 'dev-supplychain-checker-rejected-root'
          New-Item -ItemType Directory -Path $outsideSyntheticRoot -Force | Out-Null
          $env:DEV_SUPPLYCHAIN_CHECKER_TEST_NPM_CACHE_ROOTS = $outsideSyntheticRoot
          try {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
              -File .\Scan-DevSupplyChain.ps1 `
              -Path '.\tests\samples\clean-js' `
              -Checks NpmCache `
              -SyntheticValidation `
              -TextOut '.\reports\v021-rejected-synthetic-root.txt' `
              -JsonOut '.\reports\v021-rejected-synthetic-root.json' `
              -Quiet -NoColor
            $rejectedRootExit = $LASTEXITCODE
          }
          finally {
            Remove-Item Env:DEV_SUPPLYCHAIN_CHECKER_TEST_NPM_CACHE_ROOTS -ErrorAction SilentlyContinue
          }
          if ($rejectedRootExit -ne 3) { throw 'An out-of-distribution synthetic root did not fail closed.' }
          exit 0

      - name: Check publication placeholders
        shell: powershell
        run: |
          $codeowners = Get-Content -LiteralPath .\.github\CODEOWNERS -Raw
          if ($codeowners -match '(?m)^\s*[^#\s].*@your-github-user-or-team') {
            Write-Error "CODEOWNERS contains an active placeholder owner."
            exit 1
          }
          if ($codeowners -notmatch '@your-github-user-or-team') {
            Write-Host "CODEOWNERS appears to contain a real owner."
          } else {
            Write-Warning "CODEOWNERS is still a commented template. Configure it before enabling Code Owner branch rules."
          }
