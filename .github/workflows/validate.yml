            throw 'An ordinary Python extensions folder was classified as an IDE extension.'
          }
          if (@($precision.findings | Where-Object { $_.path -like '*.vscode\extensions\synthetic.publisher\extension.js' -and $_.category -eq 'IDE_EXTENSION_SECRET_EXFIL_PATTERN' }).Count -ne 1) {
